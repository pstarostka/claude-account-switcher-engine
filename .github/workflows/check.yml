name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      # Both legs always run: knowing a change breaks one platform is more
      # useful when you can see at the same time whether it broke the other.
      # Each leg is also the only thing that compiles that platform's half of
      # src/platform, so this is where a Windows-only gap shows up.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      # Unit tests, plus tests/bridge.rs, which holds the page, its bridge and
      # the registered commands and events to the same names.
      - run: cargo test
