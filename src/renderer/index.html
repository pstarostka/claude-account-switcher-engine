<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>CASE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <span class="titlebar-title" data-tip="Claude Account Switcher Engine">CASE</span>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- first run ------------------------------------------------------------->
  <main id="setup" class="view" hidden>
    <div class="setup-intro">
      <h1>Set up your accounts</h1>
      <p>Each account keeps its own login. Your skills, plugins, settings and
         transcripts in <code>~/.claude</code> are shared across all of them.</p>
    </div>
    <div id="discovered" class="list"></div>
    <p class="setup-empty" id="setup-empty" hidden>
      No Claude profiles found yet. Add one to get started.
    </p>
    <footer class="footer">
      <button class="btn ghost" id="setup-skip" data-tip="Skip this and add accounts yourself">Start empty</button>
      <button class="btn primary" id="setup-continue" data-tip="Use the ticked profiles as your accounts">Continue</button>
    </footer>
  </main>

  <!-- main picker ----------------------------------------------------------->
  <main id="picker" class="view" hidden>
    <!-- Copy is filled in from shortcut:status: the Dock and the Start menu are
         the same offer, and only the platform knows which words apply. -->
    <div id="pin-note" class="pin-note" hidden>
      <span></span>
      <button class="btn primary" id="pin-do"></button>
      <button class="iconbtn" id="pin-dismiss" aria-label="Dismiss" data-tip="Not now">✕</button>
    </div>
    <div id="archived-note" class="pin-note" hidden>
      <span id="archived-text"></span>
      <button class="btn ghost" id="archived-open" data-tip="Bring an archived profile back, or delete it for good">Archived…</button>
    </div>
    <div id="accounts" class="list"></div>
    <p class="empty" id="empty" hidden>No accounts yet.</p>
    <footer class="footer">
      <button class="btn ghost" id="add" data-tip="Create a new profile and sign in to another account">
        <svg viewBox="0 0 16 16" class="icon" aria-hidden="true">
          <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Add account
      </button>
      <button class="btn ghost" id="settings-open" aria-label="Settings"
              data-tip="Shortcut and startup options">
        <svg viewBox="0 0 16 16" class="icon" aria-hidden="true">
          <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6 3.5 3.5"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="btn ghost" id="health-open" aria-label="Session health"
              data-tip="Session health: index backups, failed saves, and sessions missing from Claude’s list">
        <svg viewBox="0 0 16 16" class="icon" aria-hidden="true">
          <path d="M8 1.8 13 3.6v4.2c0 3-2.1 5.2-5 6.4-2.9-1.2-5-3.4-5-6.4V3.6z"
                stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        Sessions
        <span class="pill" id="health-badge" hidden></span>
      </button>
    </footer>
  </main>

  <!-- session health -------------------------------------------------------->
  <main id="health" class="view" hidden>
    <div id="health-body" class="list"></div>
    <footer class="footer">
      <button class="btn ghost" id="health-back" data-tip="Back to your accounts">Back</button>
      <button class="btn ghost" id="health-refresh" data-tip="Check the logs and transcripts again now">Rescan</button>
    </footer>
  </main>

  <!-- name prompt / choices ------------------------------------------------->
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modal-title">Add account</h2>
      <p id="modal-note" class="modal-note"></p>
      <input id="modal-input" type="text" spellcheck="false" autocomplete="off" placeholder="Work">
      <div id="modal-list" class="modal-list" hidden></div>
      <p id="modal-error" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-ok">Add</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
